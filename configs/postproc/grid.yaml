# Post-processing grid (docs/EXPERIMENTS.md §4, docs/METHOD.md §10), the same for every model compared.
# CrowdAI pixel values; WHU scales lengths by 1.5 and areas by 2.25 (Phase 8).
tie_ap: 0.2                  # stage 2: within this many AP points of the best, the smallest PoLiS_paired wins
instance:                    # stage 1 of the three-class models, polygons in mode raw (36 points)
  tau: [0.3, 0.4, 0.5, 0.6]
  marker_min_px: [4, 8, 16]
  instance_min_px: [5, 10, 20]
binary:                      # stage 1 of the binary models B1-B3
  instance_min_px: [5, 10, 20]
b0:                          # stage 1 of B0, polygons in mode raw
  t_min: [0.05, 0.10, 0.15, 0.20]
polygon:                     # stage 2, modes mar and theta (36 points)
  rect_iou: [0.85, 0.90, 0.93]
  dp_k: [0.02, 0.03, 0.04, 0.06]
  snap_deg: [10, 15, 20]
yolo:                        # FULL+Y
  yolo_conf: [0.15, 0.25, 0.4]
