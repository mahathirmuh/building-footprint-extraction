# Numbers reported by other papers (docs/EVALUATION.md §7). Tables cite them from here, always marked "dilaporkan di
# paper"; they are never compared as if they came from our pipeline unless the split and protocol match (split_note).
# Values are copied as printed: AP, AR, IoU and C-IoU in percent, PoLiS in pixels.

hisup:
  crowdai_val:
    method: HiSup, HRNetV2-W48
    source:
      paper: >-
        Xu, Xu, Xue & Xia, "Accurate Polygonal Mapping of Buildings in Satellite Imagery" (HiSup),
        arXiv:2208.00609v1, 1 Aug 2022
      journal: >-
        ISPRS J. Photogramm. Remote Sens. 198:284-296 (2023), doi:10.1016/j.isprsjprs.2023.03.006;
        the journal version was not available, so its numbers are not checked against these
      tables: Table 1 (MS-COCO metrics) and Table 2 (AP_boundary, PoLiS, C-IoU, IoU)
      page: 9 (page of the arXiv PDF)
      pdf_sha256: a80edc8bb3e273b5caf5ba150b1769510673c287bcbc1590325bb4c24c2c22ff
      copied: 2026-10-30
    split_note: >-
      AICrowd (CrowdAI) val, 60,317 tiles, which HiSup uses as its test set (Sect. 5.1.1); it leaks from train
      (docs/DATA.md §2.2). Our counterpart is crowdai/val_full, used only to reproduce these numbers.
    values:
      AP: 79.4
      AP50: 92.7
      AP75: 85.3
      AR: 81.5
      AR50: 93.1
      AR75: 86.7
      AP_boundary: 66.5
      PoLiS: 0.726
      CIoU: 89.6
      IoU: 94.3

ffl:
  crowdai_val:
    method: FFL, UResNet101 (with field), frame field polygonization
    source:
      paper: >-
        Girard, Smirnov, Solomon & Tarabalka, "Polygonal Building Extraction by Frame Field Learning",
        arXiv:2004.14875v2, 31 Mar 2021 (CVPR 2021)
      tables: Table 2 (AP, AR; row "UResNet101 (with field), our poly.") and Table 1 (mean max tangent angle error)
      page: 6-7 (pages of the arXiv PDF)
      pdf_sha256: dedbe824f3b58e564b38e3fd4a4a268b35c941af89b3235975e33c4b3133b66f
      copied: 2026-11-12
    split_note: >-
      Original validation set of CrowdAI (60,317 tiles), which leaks from train (docs/DATA.md §2.2). Not comparable
      with our crowdai/test or crowdai/val_clean.
    values:
      AP: 61.3
      AP50: 87.5
      AP75: 70.6
      AR: 65.0
      AR50: 89.4
      AR75: 73.9
      MTA: 31.9

