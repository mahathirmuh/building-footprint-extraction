      AP50: 97.4
      AP75: 90
      AR: 85.2
      AR50: 98.1
      AR75: 93.5
      AP_boundary: 63.3
      IoU: 91.6
      N_ratio: 1.66
      PoLiS: 1.204
      FPS: "20.50"

pix2poly:
  crowdai_val:
    method: Pix2Poly
    source: &pix2poly_source
      paper: >-
        Adimoolam, Poullis & Averkiou, "Pix2Poly: A Sequence Prediction Method for End-to-end Polygonal Building
        Footprint Extraction from Remote Sensing Imagery", arXiv:2412.07899v1, 10 Dec 2024 (WACV 2025)
      tables: Table 5 (MS COCO metrics) and Table 6 (polygon quality), supplementary material
      page: 14 (page of the arXiv PDF)
      pdf_sha256: 25eb13f111a3115ebac60c623abb282bf67f3e1114d2cbcc3d921be00fda979d
      copied: 2026-11-12
    split_note: >-
      Original validation set of CrowdAI (60,317 tiles), which leaks from train (docs/DATA.md §2.2). Not comparable
      with our crowdai/test or crowdai/val_clean.
    values:
      AP: 79.6
      AP50: 91.6
      AP75: 85.2
      AP_S: 61.4
      AP_M: 91.9
      AP_L: 91.7
      AR: 87.7
      AR_S: 73.6
      AR_M: 96.0
      AR_L: 97.5
      IoU: 95.03
      CIoU: 89.85
      N_ratio: 1.111
      PoLiS: 0.479
      MTA: 23.1
  whu_test:
    method: Pix2Poly
    source: &pix2poly_whu_source
      paper: >-
        Adimoolam, Poullis & Averkiou, "Pix2Poly: A Sequence Prediction Method for End-to-end Polygonal Building
        Footprint Extraction from Remote Sensing Imagery", arXiv:2412.07899v1, 10 Dec 2024 (WACV 2025)
      tables: Table 1, rows "WHU Buildings test"
      page: 7 (page of the arXiv PDF)
      pdf_sha256: 25eb13f111a3115ebac60c623abb282bf67f3e1114d2cbcc3d921be00fda979d
      copied: 2026-11-12
    split_note: &pix2poly_whu_note >-
      Pix2Poly's WHU test: 3,848 tiles of 512 x 512 px at 0.2 m, ground truth from the connected components of the
      binary masks. Our test is rebuilt from the official 1024 x 1024 release (docs/DATA.md §3.2), so its tiles are
      not exactly the same: the comparison is approximate.
    values:
      IoU: 89.15
      CIoU: 81.63
      N_ratio: 1.15
      PoLiS: 1.082
      MTA: 31.64

