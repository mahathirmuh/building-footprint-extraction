    source:
      paper: >-
        Jiao, Persello & Vosselman, "PolyR-CNN: R-CNN for end-to-end polygonal building outline extraction",
        arXiv:2407.14912v1, 20 Jul 2024 (ISPRS J. Photogramm. Remote Sens. 218:33-43, 2024; the journal version was
        not available, so its numbers are not checked against these)
      tables: >-
        Table 4.1 (row "PolyR-CNN, Swin-Base"; its column headed "ARboundary" holds the AP_boundary of Table 4.4, same
        value) and Table 4.2 (FPS, batch 1, one NVIDIA Tesla V100)
