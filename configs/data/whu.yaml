# WHU aerial 0.2 m, option R (docs/DATA.md §3.2): 224 × 224 Pix2Poly patches from the 512² quadrants of the official
# tiles, main ground truth from the official buildings. Pixel parameters are the CrowdAI ones × 1.5 for lengths (odd SE
# lengths) and × 2.25 for areas (docs/METHOD.md §10).
data:
  name: whu
  tile_size: 224
  pad_to: 224

labels:
  contact_radius_px: 3
  theta_min_area_px: 45
  edge_weight_sigma_px: 4.5

priors:
  mbi_scales_px: [15, 31, 45, 61, 75, 91, 105, 121]  # 15·k rounded up to odd: line SEs need an odd length
  gap_se_length_px: 13
