[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "densepoly"
version = "0.1.0"
description = "Building polygon extraction in dense settlements: U-Net++ with gap priors, mask-derived orientation head, guided regularization"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mahathir Muhammad" }]
# torch and timm are unpinned so Colab keeps its preinstalled builds (docs/COLAB.md §2).
dependencies = [
    "torch",
    "timm",
    "segmentation-models-pytorch==0.6.*",
    "opencv-python-headless>=4.10,<5",
    "scikit-image",
    "imagecodecs",  # LZW-compressed TIFF of the official WHU 0.2 m release (read through skimage/tifffile)
    "scipy",
    "shapely>=2",
    "pycocotools",
    "imagehash",
    "omegaconf",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
    "multiprocess",  # imported by the vendored Pix2Poly metrics (third_party/pix2poly_metrics)
    "pyarrow",  # parquet tables of per-image and per-pair metrics (docs/EVALUATION.md §5)
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "nbstripout", "nbconvert"]
# Ultralytics is AGPL-3.0: optional, only for the FULL+Y experiment (docs/DATA.md §7).
yolo = ["ultralytics"]

[tool.setuptools.packages.find]
# third_party/: the vendored packages pix2poly_metrics and boundary_iou (a verbatim subset of boundary-iou-api, whose
# git install only installs its __init__.py); the verbatim Pix2Poly copies in third_party/pix2poly are not a package.
where = ["src", "third_party"]
include = ["densepoly*", "pix2poly_metrics*", "boundary_iou*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # pycocotools 2.0.11 mask.decode under numpy 2.x: third-party, harmless for now (logged in docs/progress.md)
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
    # scikit-image 0.26 morphology.reconstruction sets ndarray.shape, deprecated in numpy 2.5: third-party, harmless
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "."]
extend-exclude = ["reference", "third_party"]

[tool.ruff.format]
exclude = ["*.md"]  # code blocks in the docs are illustrative excerpts, kept as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
